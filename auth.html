<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>TEAM-CLARITY Login</title>

<style>

:root{
  --bg:#0d0d0d;
  --panel:#171717;
  --line:#2b2b2b;
  --orange:#ff5a1f;
  --text:#ffffff;
  --muted:#8f8f8f;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at top, rgba(255,90,31,0.18), transparent 35%),
    #0b0b0b;

  font-family:Arial, Helvetica, sans-serif;

  display:flex;
  justify-content:center;
  align-items:center;

  padding:24px;
  color:white;
}

.loginBox{
  width:100%;
  max-width:420px;

  background:rgba(20,20,20,0.95);

  border:1px solid #2b2b2b;

  border-radius:28px;

  padding:42px 34px;

  box-shadow:
    0 20px 60px rgba(0,0,0,0.55),
    0 0 0 1px rgba(255,255,255,0.03);
}

.logo{
  text-align:center;
  margin-bottom:28px;
}

.logo h1{
  margin:0;
  font-size:42px;
  letter-spacing:2px;
  font-weight:900;
}

.logo span{
  color:var(--orange);
}

.sub{
  text-align:center;
  color:#999;
  margin-bottom:34px;
  font-size:14px;
  letter-spacing:1px;
}

input{
  width:100%;
  padding:16px;
  margin-bottom:16px;

  background:#101010;

  border:1px solid #2a2a2a;

  border-radius:14px;

  color:white;
  font-size:15px;

  outline:none;

  transition:0.15s;
}

input:focus{
  border-color:var(--orange);
}

.mainBtn{
  width:100%;
  padding:16px;

  border:none;
  border-radius:14px;

  background:var(--orange);

  color:white;

  font-weight:800;
  font-size:15px;

  cursor:pointer;

  transition:0.15s;
}

.mainBtn:hover{
  transform:translateY(-1px);
}

.divider{
  display:flex;
  align-items:center;
  gap:12px;

  margin:24px 0;
  color:#666;
  font-size:12px;
}

.divider::before,
.divider::after{
  content:'';
  flex:1;
  height:1px;
  background:#2b2b2b;
}

.googleBtn{
  width:100%;

  padding:15px;

  background:white;
  color:black;

  border:none;
  border-radius:14px;

  font-weight:700;
  font-size:15px;

  cursor:pointer;

  margin-bottom:14px;
}

.appleBtn{
  width:100%;

  padding:15px;

  background:black;
  color:white;

  border:1px solid #333;
  border-radius:14px;

  font-weight:700;
  font-size:15px;

  cursor:pointer;
}

.bottomText{
  margin-top:24px;
  text-align:center;
  color:#777;
  font-size:13px;
  line-height:1.5;
}

</style>
</head>

<body>

<div class="loginBox">

  <div class="logo">
    <h1>TEAM<span>-CLARITY</span></h1>
  </div>

  <div class="sub">
    CLARITY CREATES INTENSITY
  </div>

  <input type="email" id="email" placeholder="Email" />

  <input type="password" id="password" placeholder="Password" />

  <button class="mainBtn" id="loginBtn">
    LOGIN / SIGNUP
  </button>

  <div class="divider">
    OR
  </div>

  <button class="googleBtn" id="googleBtn">
    Continue with Google
  </button>

  <button class="appleBtn">
    Continue with Apple
  </button>

  <div class="bottomText">
    Your account will automatically be created if it does not exist.
  </div>

</div>

<script type="module">

import { supabase } from './supabase.js'

const loginBtn = document.getElementById('loginBtn')
const googleBtn = document.getElementById('googleBtn')

loginBtn.addEventListener('click', async () => {

  const email = document.getElementById('email').value
  const password = document.getElementById('password').value

  const { error: loginError } =
    await supabase.auth.signInWithPassword({
      email,
      password
    })

  if (!loginError) {
    window.location.href = 'index.html'
    return
  }

  const { error: signupError } =
    await supabase.auth.signUp({
      email,
      password
    })

  if (signupError) {
    alert(signupError.message)
    return
  }

  alert('Account created. Please login again.')
})

googleBtn.addEventListener('click', async () => {

  await supabase.auth.signInWithOAuth({
    provider: 'google',
    options: {
      redirectTo: window.location.origin
    }
  })

})

</script>

</body>
</html>
