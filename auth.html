<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>TEAM-CLARITY Login</title>

<style>
:root{
  --bg:#0d0d0d;
  --panel:#171717;
  --line:#2b2b2b;
  --orange:#ff5a1f;
  --text:#ffffff;
  --muted:#8f8f8f;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at top, rgba(255,90,31,0.18), transparent 35%),
    #0b0b0b;
  font-family:Arial, Helvetica, sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:24px;
  color:white;
}

.loginBox{
  width:100%;
  max-width:420px;
  background:rgba(20,20,20,0.95);
  border:1px solid #2b2b2b;
  border-radius:28px;
  padding:42px 34px;
  box-shadow:
    0 20px 60px rgba(0,0,0,0.55),
    0 0 0 1px rgba(255,255,255,0.03);
}

.logo{
  text-align:center;
  margin-bottom:28px;
}

.logo h1{
  margin:0;
  font-size:42px;
  letter-spacing:2px;
  font-weight:900;
}

.logo span{
  color:var(--orange);
}

.sub{
  text-align:center;
  color:#999;
  margin-bottom:34px;
  font-size:14px;
  letter-spacing:1px;
}

input{
  width:100%;
  padding:16px;
  margin-bottom:16px;
  background:#101010;
  border:1px solid #2a2a2a;
  border-radius:14px;
  color:white;
  font-size:15px;
  outline:none;
  transition:0.15s;
}

input:focus{
  border-color:var(--orange);
}

.mainBtn{
  width:100%;
  padding:16px;
  border:none;
  border-radius:14px;
  background:var(--orange);
  color:white;
  font-weight:800;
  font-size:15px;
  cursor:pointer;
  transition:0.15s;
}

.mainBtn:hover{
  transform:translateY(-1px);
}

.mainBtn:disabled{
  opacity:0.65;
  cursor:not-allowed;
  transform:none;
}

.divider{
  display:flex;
  align-items:center;
  gap:12px;
  margin:24px 0;
  color:#666;
  font-size:12px;
}

.divider::before,
.divider::after{
  content:'';
  flex:1;
  height:1px;
  background:#2b2b2b;
}

.googleBtn{
  width:100%;
  padding:15px;
  background:white;
  color:black;
  border:none;
  border-radius:14px;
  font-weight:700;
  font-size:15px;
  cursor:pointer;
  margin-bottom:14px;
}

.bottomText{
  margin-top:24px;
  text-align:center;
  color:#777;
  font-size:13px;
  line-height:1.5;
}

/* TEAM-CLARITY POPUP */
.tcPopupOverlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.75);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:99999;
  padding:24px;
}

.tcPopupBox{
  width:min(420px,90vw);
  background:#151515;
  border-radius:28px;
  padding:34px 28px;
  text-align:center;
  border:1px solid rgba(255,90,31,0.65);
  box-shadow:
    0 24px 70px rgba(0,0,0,.65),
    0 0 0 1px rgba(255,255,255,0.04);
}

.tcPopupBox h2{
  margin:0 0 14px;
  color:#ff5a1f;
  font-size:30px;
  font-weight:900;
}

.tcPopupBox p{
  margin:0 0 24px;
  color:#ddd;
  font-size:15px;
  line-height:1.5;
  font-weight:700;
}

.tcPopupBox button{
  width:100%;
  height:54px;
  border:none;
  border-radius:14px;
  background:#ff5a1f;
  color:white;
  font-size:15px;
  font-weight:900;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="loginBox">

  <div class="logo">
    <h1>TEAM<span>-CLARITY</span></h1>
  </div>

  <div class="sub">
    CLARITY CREATES INTENSITY
  </div>

  <input type="email" id="email" placeholder="Email" />

  <input type="password" id="password" placeholder="Password" />

  <input type="text" id="accessCode" placeholder="Access Code / Promo Code" />

  <button class="mainBtn" id="loginBtn">
    LOGIN / SIGNUP
  </button>

  <div class="divider">
    OR
  </div>

  <button class="googleBtn" id="googleBtn">
    Continue with Google
  </button>

  <div class="bottomText">
    Your account will automatically be created if it does not exist.
  </div>

</div>

<div id="tcPopupOverlay" class="tcPopupOverlay">
  <div class="tcPopupBox">
    <h2 id="tcPopupTitle">TEAM-CLARITY</h2>
    <p id="tcPopupText"></p>
    <button id="tcPopupBtn">CONTINUE</button>
  </div>
</div>

<script type="module">
import { supabase } from './supabase.js'

const loginBtn = document.getElementById('loginBtn')
const googleBtn = document.getElementById('googleBtn')
const emailInput = document.getElementById('email')
const passwordInput = document.getElementById('password')
const accessCodeInput = document.getElementById('accessCode')

function showTCPopup(title, text) {
  document.getElementById("tcPopupTitle").textContent = title
  document.getElementById("tcPopupText").textContent = text
  document.getElementById("tcPopupOverlay").style.display = "flex"
}

document.getElementById("tcPopupBtn").onclick = () => {
  document.getElementById("tcPopupOverlay").style.display = "none"
}

async function applyTeamAccessCode() {
  const code =
    accessCodeInput.value.trim().toUpperCase() ||
    localStorage.getItem("pending_access_code")

  if (!code) return true

  const { data: { user } } = await supabase.auth.getUser()

  if (!user) return false

  const { data: team, error: teamError } = await supabase
    .from("team_codes")
    .select("*")
    .eq("code", code)
    .maybeSingle()

  if (teamError || !team) {
    localStorage.setItem("pending_access_code", code)
    return true
  }

  if (!team.active) {
    showTCPopup("Access Code Disabled", "This team access code is currently disabled.")
    return false
  }

  const { data: existingMember } = await supabase
    .from("team_members")
    .select("*")
    .eq("team_code_id", team.id)
    .eq("user_id", user.id)
    .maybeSingle()

  if (existingMember) {
    if (!existingMember.active) {
      showTCPopup("Access Removed", "This account has been removed from this team.")
      return false
    }

    localStorage.removeItem("pending_access_code")
    return true
  }

  const { count } = await supabase
    .from("team_members")
    .select("*", { count: "exact", head: true })
    .eq("team_code_id", team.id)
    .eq("active", true)

  if ((count || 0) >= team.max_users) {
    showTCPopup("Team Full", "This team access code has reached its maximum number of accounts.")
    return false
  }

  const { error: insertError } = await supabase
    .from("team_members")
    .insert({
      team_code_id: team.id,
      user_id: user.id,
      email: user.email,
      active: true
    })

  if (insertError) {
    showTCPopup("Access Error", insertError.message)
    return false
  }

  localStorage.removeItem("pending_access_code")
  return true
}

function redirectAfterLogin() {
  const params = new URLSearchParams(window.location.search)
  const next = params.get("next")
  const pendingMobileCode = localStorage.getItem("pending_mobile_folder_code")

  if (
    pendingMobileCode &&
    /Android|iPhone|iPod/i.test(navigator.userAgent)
  ) {
    window.location.href =
      "mobile-simulator.html?code=" + encodeURIComponent(pendingMobileCode)
    return
  }

  if (next) {
    window.location.href = next
    return
  }

  window.location.href = "index.html"
}

loginBtn.addEventListener('click', async () => {
  const email = emailInput.value.trim()
  const password = passwordInput.value.trim()
  const accessCode = accessCodeInput.value.trim().toUpperCase()

  if (accessCode) {
    localStorage.setItem("pending_access_code", accessCode)
  }

  if (!email || !password) {
    showTCPopup(
      "Missing Details",
      "Please enter your email and password to continue."
    )
    return
  }

  loginBtn.disabled = true
  loginBtn.textContent = "Checking..."

  const { error: loginError } =
    await supabase.auth.signInWithPassword({
      email,
      password
    })

  if (!loginError) {
    const ok = await applyTeamAccessCode()

    if (!ok) {
      loginBtn.disabled = false
      loginBtn.textContent = "LOGIN / SIGNUP"
      return
    }

    redirectAfterLogin()
    return
  }

 // Sign-in failed. Work out WHY before trying to create a new account,
  // otherwise an existing user just gets a confusing "already registered".
  const loginMsg = (loginError.message || "").toLowerCase()

  if (loginMsg.includes("email not confirmed")) {
    loginBtn.disabled = false
    loginBtn.textContent = "LOGIN / SIGNUP"
    showTCPopup(
      "Confirm Your Email",
      "This account exists but the email hasn't been confirmed yet. Check your inbox (and spam) for the confirmation link, then log in again — or use \"Continue with Google\"."
    )
    return
  }

  const { error: signupError } =
    await supabase.auth.signUp({
      email,
      password
    })

  loginBtn.disabled = false
  loginBtn.textContent = "LOGIN / SIGNUP"

  if (signupError) {
    const signupMsg = signupError.message.toLowerCase()

    if (signupMsg.includes("rate limit")) {
      showTCPopup(
        "Please Wait",
        "Too many login attempts. Please wait a few minutes and try again, or use Continue with Google."
      )
    } else if (signupMsg.includes("already registered") || signupMsg.includes("already exists")) {
      showTCPopup(
        "You Already Have an Account",
        "This email is already registered with TEAM-CLARITY. Please enter the password you first signed up with. If you joined with \"Continue with Google\", use that button instead — or ask your coach to reset your password."
      )
    } else {
      showTCPopup(
        "Login Error",
        signupError.message
      )
    }

    return
  }

  passwordInput.value = ""

  showTCPopup(
    "Account Created",
    "Your TEAM-CLARITY account is ready. Please log in now to continue."
  )
})

googleBtn.addEventListener('click', async () => {
  const params = new URLSearchParams(window.location.search)
  const next = params.get("next")
  const pendingMobileCode = localStorage.getItem("pending_mobile_folder_code")
  const accessCode = accessCodeInput.value.trim().toUpperCase()

  if (accessCode) {
    localStorage.setItem("pending_access_code", accessCode)
  }

  let redirectUrl = window.location.origin + "/auth.html"

  if (pendingMobileCode && /Android|iPhone|iPod/i.test(navigator.userAgent)) {
    redirectUrl =
      window.location.origin +
      "/mobile-simulator.html?code=" +
      encodeURIComponent(pendingMobileCode)
  } else if (next) {
    redirectUrl =
      window.location.origin +
      "/auth.html?next=" +
      encodeURIComponent(next)
  }

  const { error: oauthError } = await supabase.auth.signInWithOAuth({
    provider: 'google',
    options: {
      redirectTo: redirectUrl
    }
  })

  if (oauthError) {
    showTCPopup("Google Sign-In Error", oauthError.message)
  }
})

// Handle the return trip from Google (and the case where the visitor is
// already signed in). Supabase parses the session out of the URL during
// startup; once it's there we finish the job the same way the email/password
// path does — apply any pending team code, then move into the app.
;(async () => {
  const { data: { session } } = await supabase.auth.getSession()
  if (!session) return
  const ok = await applyTeamAccessCode()
  if (ok) redirectAfterLogin()
})()
</script>
<script type="module" src="paywall.js"></script>
</body>
</html>
