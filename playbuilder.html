<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TEAM-CLARITY — Play Builder</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div id="topbar">
    <a href="index.html" class="brand">
      <img src="assets/tc-logo.png" class="tcLogo" />
      <span class="liveBadge">BUILDER</span>
    </a>

    <div class="tools">
      <div class="toolGroup">
        <button onclick="window.location.href='index.html'">Home</button>
        <button id="setPieceCycleBtn" class="primaryBtn">Set Piece</button>
        <button id="builderMainBtn" class="primaryBtn">Start Builder</button>
        <button id="playAnimationBtn">Play</button>
        <button id="clearStepsBtn" class="resetBtn">Clear</button>
      </div>

      <div class="toolGroup secondaryRow">
        <select id="pitchMode" title="Pitch Mode">
          <option value="full">Full Pitch</option>
          <option value="half">Half Pitch</option>
          <option value="lineout">Lineout</option>
        </select>

        <select id="teamColor">
          <option value="red">Red</option>
          <option value="white">White</option>
          <option value="black">Black</option>
          <option value="blue">Blue</option>
        </select>

        <select id="playerGroup">
          <option value="all">All Players</option>
          <option value="forwards">Forwards</option>
          <option value="backs">Backs</option>
        </select>

        <select id="playerSize">
          <option value="standard">Standard</option>
<option value="small">Small</option>
        </select>

        <button id="savePlayBtn">Save</button>
        <button id="loadPlayBtn">Load</button>
        <button id="foldersBtn">Folders</button>

        <label class="speedLabel">
          Speed
          <input id="builderSpeed" type="range" min="0.25" max="2" step="0.25" value="1" />
          <span id="builderSpeedValue">1x</span>
        </label>
      </div>
    </div>
  </div>

  <div id="fieldShell">
    <canvas id="field" width="1600" height="900"></canvas>
  </div>

  <div id="playModal" class="modal hidden">
    <div class="modalCard">
      <div class="modalHeader">
        <h2>📂 Saved Plays</h2>
        <button id="closePlayModal">Close</button>
      </div>
      <div id="savedPlaysList"></div>
    </div>
  </div>

  <div id="foldersModal" class="modal hidden">
    <div class="modalCard">
      <div class="modalHeader">
        <h2>🗂 Team Folders</h2>
        <button id="closeFoldersModal">Close</button>
      </div>

      <div class="folderCreateRow">
        <input type="text" id="newFolderName" placeholder="Folder name" />
        <button id="createFolderBtn">Create Folder</button>
      </div>

      <div id="foldersList" class="foldersList"></div>
    </div>
  </div>

  <div id="paywallOverlay" class="paywall hidden">
  <div class="paywallCard">
    <h1 id="paywallTitle">SESSION LIVE 🔴</h1>
    <p id="paywallLine1">Your session is connected.</p>
    <p id="paywallLine2">To keep using TEAM-CLARITY:</p>

    <div id="paywallPrice" class="price">€2.99 / month</div>

    <p style="font-size:14px;color:#6f6f6f;margin-top:-12px;margin-bottom:20px;">
      Recurring monthly subscription. Cancel anytime.
    </p>

    <button id="unlockBtn">Start Subscription</button>

    <div class="promoBox">
      <label id="promoLabel">Promo code:</label>
      <input id="promoInput" placeholder="Enter code" />
      <button id="promoBtn">Apply Promo Code</button>
      <div id="promoMessage"></div>
    </div>
  </div>
</div>

  <script src="/socket.io/socket.io.js"></script>

  <script type="module">
    import { supabase } from './supabase.js'

    const {
      data: { session }
    } = await supabase.auth.getSession()

    if (!session) {
      window.location.href = 'auth.html'
    }
  </script>

  <script type="module" src="playbuilder.js"></script>
</body>
</html>
