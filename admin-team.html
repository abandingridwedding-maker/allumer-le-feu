<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Team — TEAM-CLARITY Admin</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .teamMetaGrid {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 8px 18px;
      margin: 4px 0 4px;
      font-size: 1rem;
    }
    .teamMetaGrid .label { color: #666; font-weight: 600; }
    .teamMetaGrid .value { font-weight: 700; }
    .teamControlsRow {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      margin-top: 6px;
    }
    .teamControlsRow input[type="number"] {
      width: 110px;
      padding: 11px 13px;
      border: 1px solid #d0d3d8;
      border-radius: 9px;
      font-size: 1rem;
    }
    #deleteTeamBtn {
      background: #fff;
      color: #c02626;
      border: 1px solid #c02626;
    }
    #teamMessage { margin-top: 12px; font-weight: 600; min-height: 1.2em; }
  </style>
</head>

<body class="adminBody">

  <header class="adminTopbar">
    <img src="assets/tc-logo.png" class="adminLogo" alt="TEAM-CLARITY" />

    <div class="adminTopActions">
      <button onclick="window.location.href='admin.html'">← Back to Teams</button>
      <button onclick="window.location.href='index.html'">Home</button>
      <button onclick="window.location.href='https://team-clarity.org'">Go to Site</button>
    </div>
  </header>

  <main class="adminScreen">

    <section class="adminHero">
      <h1 id="teamTitle">Loading…</h1>
      <p>Manage this team's access code, squad size and players.</p>
    </section>

    <section class="adminCard">
      <h2>Team Details</h2>

      <div class="teamMetaGrid">
        <div class="label">Code:</div>   <div class="value" id="teamCode">—</div>
        <div class="label">Users:</div>  <div class="value" id="userCount">—</div>
        <div class="label">Status:</div> <div class="value" id="teamStatus">—</div>
      </div>

      <div class="teamControlsRow">
        <label for="maxUsersInput" class="label">Max users:</label>
        <input id="maxUsersInput" type="number" min="1" value="45" />
        <button id="updateMaxUsersBtn">Update Max Users</button>
        <button id="toggleActiveBtn">Enable / Disable</button>
        <button id="deleteTeamBtn">Delete Team</button>
      </div>

      <p id="teamMessage"></p>
    </section>

    <section class="adminCard">
      <h2>Players</h2>
      <div id="playersList">Loading players…</div>
    </section>

  </main>

  <script type="module" src="./admin-team.js"></script>
  <script type="module" src="team-badge.js"></script>
</body>
</html>
