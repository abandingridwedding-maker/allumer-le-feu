<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Team — TEAM-CLARITY</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .memberCard {
      border: 2px solid #ccc;
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 8px;
    }
    .memberCard.coach { border-color: #e8590c; }
    .memberCard p { margin: 4px 0; }
    #myTeamMessage { margin-top: 12px; font-weight: 600; min-height: 1.2em; }
    .roleTag {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 700;
      background: #eee;
    }
    .roleTag.coach { background: #ffe3d3; color: #e8590c; }
    .roleTag.head_coach { background: #e8590c; color: #fff; }
  </style>
</head>

<body class="adminBody">

  <header class="adminTopbar">
    <img src="assets/tc-logo.png" class="adminLogo" alt="TEAM-CLARITY" />
    <div class="adminTopActions">
      <button onclick="window.location.href='index.html'">Home</button>
    </div>
  </header>

  <main class="adminScreen">

    <section class="adminHero">
      <h1 id="myTeamTitle">My Team</h1>
      <p id="myTeamSubtitle">Loading…</p>
    </section>

    <section class="adminCard">
      <h2>Members</h2>
      <div id="membersList">Loading members…</div>
      <p id="myTeamMessage"></p>
    </section>

  </main>

  <script type="module" src="./my-team.js"></script>
  <script type="module" src="team-badge.js"></script>
</body>
</html>
