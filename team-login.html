<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>TEAM-CLARITY — Team Login</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body class="teamLoginBody">

  <main class="teamLoginScreen">

    <img src="assets/tc-logo.png" class="teamLoginLogo" alt="TEAM-CLARITY" />

    <section class="teamLoginCard">
      <div class="teamLoginIcon">🔐</div>

      <h1>Team Login</h1>
      <p>Enter your email, password and team code to activate club access.</p>

      <input id="email" type="email" placeholder="Email" />
      <input id="password" type="password" placeholder="Password" />
      <input id="teamCode" type="text" placeholder="Team Code" />

      <button id="teamLoginBtn">Login / Sign up with Team Code</button>

      <p id="teamLoginMessage"></p>

      <button class="teamLoginBackBtn" onclick="window.location.href='index.html'">
        ← Back
      </button>
    </section>

  </main>

  <script type="module" src="./team-login.js"></script>
  <script type="module" src="paywall.js"></script>
</body>
</html>
