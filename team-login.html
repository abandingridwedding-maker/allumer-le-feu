<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>TEAM-CLARITY — Team Login</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;">
    <div style="width:100%;max-width:420px;background:white;border-radius:24px;padding:32px;box-shadow:0 20px 60px rgba(0,0,0,.12);">
      <h1 style="margin-top:0;">TEAM LOGIN</h1>
      <p>Enter your team code to join your club access.</p>

      <input id="email" type="email" placeholder="Email" style="width:100%;padding:14px;margin-bottom:12px;" />
      <input id="password" type="password" placeholder="Password" style="width:100%;padding:14px;margin-bottom:12px;" />
      <input id="teamCode" type="text" placeholder="Team Code" style="width:100%;padding:14px;margin-bottom:16px;" />

      <button id="teamLoginBtn" style="width:100%;padding:16px;font-weight:800;">
        LOGIN / SIGNUP WITH TEAM CODE
      </button>

      <p id="teamLoginMessage" style="margin-top:16px;"></p>

      <button onclick="window.location.href='index.html'" style="width:100%;padding:12px;margin-top:12px;">
        Back
      </button>
    </div>
  </main>

  <script type="module" src="./team-login.js"></script>
</body>
</html>
