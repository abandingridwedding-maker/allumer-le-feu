<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>TEAM-CLARITY — Team Login</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body class="teamLoginBody">

  <main class="teamLoginScreen">

    <img src="assets/tc-logo.png" class="teamLoginLogo" alt="TEAM-CLARITY" />

    <section class="teamLoginCard">
      <div class="teamLoginIcon">🔐</div>

      <h1>Team Login</h1>

      <!-- Shown while we check if they're logged in -->
      <p id="teamLoginStatus">Checking your login…</p>

      <!-- The activation form (hidden until we know they're logged in) -->
      <div id="teamCodeArea" style="display:none;">
        <p id="loggedInAs" style="font-weight:600;"></p>
        <p>Enter your team code to activate club access.</p>

        <input id="teamCode" type="text" placeholder="Team Code" />
        <button id="teamLoginBtn">Activate team access</button>

        <p id="teamLoginMessage"></p>

        <button class="teamLoginBackBtn" id="signOutBtn" style="margin-top:10px;">
          Not you? Log out
        </button>
      </div>

      <button class="teamLoginBackBtn" onclick="window.location.href='index.html'">
        ← Back
      </button>
    </section>

  </main>

  <script type="module" src="./team-login.js"></script>
  <script type="module" src="paywall.js"></script>
  <script type="module" src="team-badge.js"></script>
</body>
</html>
