<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>TEAM-CLARITY — Simulator Controller</title>

<style>
  * {
    box-sizing: border-box;
    touch-action: none;
  }

  :root {
    --orange: #ff5a00;
    --white: #ffffff;
    --black: #151515;
    --muted: #6b6b6b;
    --green: #16a34a;
    --border: rgba(0,0,0,.12);
    --shadow: 0 22px 50px rgba(0,0,0,.18);
  }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(circle at top left, rgba(255,90,0,.16), transparent 36%),
      linear-gradient(180deg, #ffffff 0%, #fff3e8 100%);
    color: var(--black);
    font-family: Inter, Arial, Helvetica, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 26px 18px 24px;
    overflow: hidden;
  }

  .topCard {
    width: min(390px, 100%);
    background: rgba(255,255,255,.86);
    border: 1px solid var(--border);
    border-radius: 28px;
    padding: 20px 18px;
    box-shadow: var(--shadow);
    text-align: center;
  }

  .brand {
    font-size: 25px;
    font-weight: 950;
    letter-spacing: -0.04em;
    line-height: 1;
  }

  .brand span {
    color: var(--orange);
  }

  .subtitle {
    margin-top: 8px;
    color: var(--muted);
    font-size: 13px;
    font-weight: 800;
    letter-spacing: .08em;
    text-transform: uppercase;
  }

  .status {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 14px;
    padding: 9px 13px;
    border-radius: 999px;
    background: rgba(22,163,74,.12);
    color: var(--green);
    font-size: 14px;
    font-weight: 900;
  }

  .playerCard {
    text-align: center;
  }

  .playerLabel {
    font-size: 13px;
    font-weight: 900;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .12em;
    margin-bottom: 6px;
  }

  .playerNumber {
    font-size: 90px;
    line-height: .9;
    font-weight: 1000;
    color: var(--orange);
    letter-spacing: -0.08em;
    text-shadow: 0 8px 0 rgba(255,90,0,.12);
  }

  .joystickWrap {
    background: rgba(255,255,255,.74);
    border: 1px solid var(--border);
    border-radius: 36px;
    padding: 22px;
    box-shadow: var(--shadow);
  }

  #joystick {
    width: 270px;
    height: 270px;
    border-radius: 50%;
    border: 2px solid rgba(255,90,0,.35);
    background:
      radial-gradient(circle at center,
      rgba(255,90,0,.10) 0%,
      rgba(255,90,0,.05) 34%,
      rgba(0,0,0,.04) 70%,
      rgba(0,0,0,.08) 100%),
      #fff;
    position: relative;
    box-shadow:
      inset 0 0 0 16px rgba(255,90,0,.06),
      inset 0 0 42px rgba(0,0,0,.08);
  }

  #stick {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    background: linear-gradient(180deg, #ff7a1a, var(--orange));
    border: 6px solid white;
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    box-shadow:
      0 18px 34px rgba(255,90,0,.38),
      0 0 0 1px rgba(0,0,0,.08);
  }

  .instructions {
    width: min(390px, 100%);
    text-align: center;
    color: #444;
    font-size: 15px;
    line-height: 1.42;
    font-weight: 700;
    background: rgba(255,255,255,.64);
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 14px 18px;
  }
</style>
</head>

<body>

  <div class="topCard">
    <div class="brand">
      TEAM-<span>CLARITY</span>
    </div>

    <div class="subtitle">
      Simulator Controller
    </div>

    <div class="status" id="status">
      Connected ✅
    </div>
  </div>

  <div class="playerCard">
    <div class="playerLabel">
      Player
    </div>

    <div class="playerNumber" id="playerNumber">
      ?
    </div>
  </div>

  <div class="joystickWrap">
    <div id="joystick">
      <div id="stick"></div>
    </div>
  </div>

  <div class="instructions">
    Move in rhythm with the ghost player.
    <br />
    Timing is scored automatically from your movement and final position.
  </div>

<script src="/socket.io/socket.io.js"></script>
<script src="simcontroller.js"></script>
<script type="module" src="paywall.js"></script>
</body>
</html>
