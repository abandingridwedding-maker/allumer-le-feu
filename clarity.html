<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TEAM-CLARITY — Live</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div id="topbar">
    <a href="index.html" class="brand">
      <img src="assets/tc-logo.png" class="tcLogo" />
      <span class="liveBadge">LIVE</span>
    </a>

    <div class="tools">
      <div class="toolGroup">
        <button onclick="window.location.href='index.html'">Home</button>
        <button id="qrBtn">QR Codes</button>
        <button id="setPieceCycleBtn" class="primaryBtn">Set Piece</button>
        <button id="freezeBtn">Freeze</button>
        <button id="resetBtn" class="resetBtn">Reset</button>
      </div>

      <div class="toolGroup secondaryRow">
        <select id="pitchMode" title="Pitch Mode">
          <option value="full">Full Pitch</option>
          <option value="half">Half Pitch</option>
          <option value="lineout">Lineout</option>
        </select>

        <select id="teamColor">
          <option value="red">Red</option>
          <option value="white">White</option>
          <option value="black">Black</option>
          <option value="blue">Blue</option>
        </select>

        <select id="playerGroup">
          <option value="all">All Players</option>
          <option value="forwards">Forwards</option>
          <option value="backs">Backs</option>
        </select>

        <select id="playerSize">
          <option value="standard">Standard</option>
<option value="small">Small</option>
        </select>

        <label class="speedLabel">
          Speed
          <input id="speed" type="range" min="0.5" max="2" step="0.5" value="2" />
          <span id="speedValue">1.0x</span>
        </label>
      </div>
    </div>
  </div>

  <div id="fieldShell">
    <canvas id="field" width="1600" height="900"></canvas>
  </div>

  <div id="qrModal" class="modal hidden">
    <div class="modalCard">
      <div class="modalHeader">
        <h2 id="qrTitle">Scan to control players</h2>
        <button id="closeQr">Close</button>
      </div>
      <div id="qrGrid"></div>
    </div>
  </div>


  <script src="/socket.io/socket.io.js"></script>
  <script src="coach.js?v=20260526a"></script>

  <script type="module">
    import { supabase } from './supabase.js'

    const {
      data: { session }
    } = await supabase.auth.getSession()

    if (!session) {
  window.location.href = "auth.html?next=" + encodeURIComponent(window.location.pathname.split("/").pop());
}
  </script>
  <script type="module" src="paywall.js"></script>
</body>
</html>
