<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TEAM-CLARITY | Join Folder</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body class="joinFolderBody">

  <main class="joinFolderScreen">
    <img src="assets/tc-logo.png" class="joinFolderLogo" alt="TEAM-CLARITY" />

    <section class="joinFolderCard">
      <div class="joinFolderIcon">📁</div>
      <h1>Join Team Folder</h1>
      <p>Enter the folder code shared by your coach.</p>

      <input
        id="shareCode"
        type="text"
        placeholder="ENTER SHARE CODE"
        autocomplete="off"
      />

      <button id="joinFolderBtn">Join Folder</button>

      <button id="backHomeBtn" class="joinBackBtn">← Back to Home</button>

      <div id="joinMessage"></div>
    </section>
  </main>

  <script type="module" src="joinfolder.js"></script>
  <script type="module" src="paywall.js"></script>
</body>
</html>
