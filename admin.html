<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TEAM-CLARITY Admin</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body class="adminBody">

  <header class="adminTopbar">
    <img src="assets/tc-logo.png" class="adminLogo" alt="TEAM-CLARITY" />

    <div class="adminTopActions">
      <button onclick="window.location.href='index.html'">Home</button>
      <button onclick="window.location.href='https://team-clarity.org'">Go to Site</button>
    </div>
  </header>

  <main class="adminScreen">

    <section class="adminHero">
      <h1>Team Access Manager</h1>
      <p>Create and manage team access codes for 45-player squad packages.</p>
    </section>

    <section class="adminCard">
      <h2>Create Team Code</h2>

      <div class="adminCreateRow">
        <input id="teamName" placeholder="Team name e.g. LOU Rugby" />
        <input id="teamCode" placeholder="Code e.g. LOU2026" />
        <input id="maxUsers" type="number" value="45" />
        <button id="createTeamBtn">Create Team Code</button>
      </div>

      <p id="adminMessage"></p>
    </section>

    <section class="adminCard">
      <h2>Existing Teams</h2>
      <div id="teamsList"></div>
    </section>

  </main>

  <script type="module" src="./admin.js"></script>
</body>
</html>
