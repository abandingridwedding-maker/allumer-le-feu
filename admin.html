<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TEAM-CLARITY Admin</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="topbar">
    <div class="brand">TEAM-CLARITY ADMIN</div>
    <button onclick="window.location.href='index.html'">Home</button>
  </div>

  <main style="padding:24px; max-width:900px; margin:auto;">
    <h1>Team Access Codes</h1>

    <section style="margin-bottom:30px;">
      <h2>Create Team Code</h2>

      <input id="teamName" placeholder="Team name e.g. LOU Rugby" />
      <input id="teamCode" placeholder="Code e.g. LOU2026" />
      <input id="maxUsers" type="number" value="45" />

      <button id="createTeamBtn">Create Team Code</button>
      <p id="adminMessage"></p>
    </section>

    <section>
      <h2>Existing Teams</h2>
      <div id="teamsList"></div>
    </section>
  </main>

  <script type="module" src="./admin.js"></script>
</body>
</html>
